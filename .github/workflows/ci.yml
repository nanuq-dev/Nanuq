name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5

      - name: Installer le projet + dépendances de dev
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Format check (ruff) — informatif
        run: uv run ruff format --check src/ tests/
        continue-on-error: true

      - name: Types (mypy) — informatif
        run: uv run mypy src/nanuq
        continue-on-error: true

      - name: Tests avec couverture
        env:
          LOKY_MAX_CPU_COUNT: "2"
        run: uv run pytest --cov=nanuq --cov-report=term-missing